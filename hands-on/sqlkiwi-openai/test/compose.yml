name: sqlkiwi-openai-tests
services:
  postgres:
    image: postgres:18-alpine
    container_name: sqlkiwi-openai-test-pg
    ports: ["127.0.0.1:55433:5432"]
    environment:
      POSTGRES_USER: sqlkiwi
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: sqlkiwi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlkiwi -d sqlkiwi"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    container_name: sqlkiwi-openai-test-mysql
    ports: ["127.0.0.1:53307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: local-test-only
      MYSQL_DATABASE: sqlkiwi
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 45
