# sqlkiwi 시험용 DB (PostgreSQL, MySQL)
# 기동: docker compose -f test-db/compose.yml up -d   (hands-on/sqlkiwi 폴더에서)
# 정지와 데이터 삭제: docker compose -f test-db/compose.yml down -v
# 공용 실습 DB(backing-services/rdb, 5432)와 겹치지 않게 포트를 따로 씀.
# 계정은 시험 전용 고정값이며 실제 서비스에 쓰지 않음.
name: sqlkiwi-test
services:
  pg:
    image: postgres:18-alpine
    container_name: sqlkiwi-test-pg
    environment:
      POSTGRES_DB: kiwi
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwi
    ports:
      - "55432:5432"
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi -d kiwi"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: sqlkiwi-test-mysql
    environment:
      MYSQL_DATABASE: kiwi
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi
      MYSQL_ROOT_PASSWORD: kiwi-root
    ports:
      - "53306:3306"
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukiwi -pkiwi --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
